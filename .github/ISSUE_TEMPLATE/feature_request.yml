name: Feature Request
description: Suggest an idea or enhancement for sqwai
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for sqwai? Please check [DESIGN.md](https://github.com/hksae/sqwai/blob/master/DESIGN.md) to see if it aligns with the core architecture.
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem? A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
    validations:
      required: false
