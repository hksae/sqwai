[package]
name = "sqwai"
version = "0.1.0"
edition = "2024"
description = "TUI coding agent"
license = "Apache-2.0"
repository = "https://github.com/hksae/sqwai"

[dependencies]
anyhow = "1"
arboard = "3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
cozo = { version = "0.7.6", default-features = false, features = ["storage-sqlite", "storage-sqlite-src", "rayon"] }
crossterm = "0.28"
directories = "6"
eventsource-stream = "0.2"
futures = "0.3"
http = "1"
globset = "0.4"
ignore = "0.4"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
git2 = "0.21"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tui-textarea = "0.7"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
