name: Update Built-in Providers

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-providers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        run: |
          set -euo pipefail
          python3 --version
          python3 .github/scripts/update_providers.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --porcelain -- builtin_providers.toml
          if git diff --quiet HEAD -- builtin_providers.toml; then
            echo "No changes in builtin_providers.toml"
          else
            git diff --stat HEAD -- builtin_providers.toml
            git add builtin_providers.toml
            git commit -m "chore(providers): update builtin_providers.toml [skip ci]"
            git push origin HEAD:master
          fi
