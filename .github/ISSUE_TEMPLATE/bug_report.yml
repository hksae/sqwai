name: Bug Report
description: Report an issue or bug in sqwai
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out this form as accurately as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `sqwai`
        2. Enter prompt ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & Terminal
      placeholder: "e.g., Windows 11 / Windows Terminal, Ubuntu 24.04 / Alacritty, macOS 15 / Kitty"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model & Provider
      placeholder: "e.g., Anthropic claude-3-7-sonnet, OpenAI gpt-4o, Ollama qwen2.5-coder"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: sqwai Version / Commit
      placeholder: "e.g., commit abc1234 or git rev-parse HEAD"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output or Logs
      description: Paste any terminal output, panic backtraces, or logs from `.sqwai/sessions/`.
      render: shell
    validations:
      required: false
